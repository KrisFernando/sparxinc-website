<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Pusher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #1b5a8a;
            --bg-tertiary: #ffffff;
            --accent-primary: #3dd5d5;
            --accent-secondary: #a855f7;
            --accent-coral: #ef5a6f;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --text-white: #ffffff;
            --border-color: #e5e7eb;
            --shadow-glow: rgba(61, 213, 213, 0.25);
            --danger: #ef5a6f;
            --warning: #fbbf24;
            --success: #3dd5d5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.03) 0%, transparent 50%);
            animation: subtle-drift 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes subtle-drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2%, 2%); }
        }

        .container {
            width: 100%;
            max-width: 1130px;
            position: relative;
            z-index: 1;
            animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--accent-primary), 
                transparent);
            opacity: 0.3;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .mode-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
            color: white;
        }

        .mode-badge.encrypt {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        }

        .mode-badge.decrypt {
            background: linear-gradient(135deg, var(--accent-coral), var(--warning));
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
        }

        .password-display {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .password-value {
            flex: 1;
            font-family: 'DM Mono', monospace;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            background: var(--bg-tertiary);
            padding: 18px 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            word-break: break-all;
        }

        .password-value:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px var(--shadow-glow);
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            border: none;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-glow);
        }

        .icon-btn:active {
            transform: translateY(0);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-primary);
            transition: stroke 0.3s;
        }

        .icon-btn:hover svg {
            stroke: white;
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
        }

        .copy-btn:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .copy-btn svg {
            stroke: white;
        }

        .strength-indicator {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .strength-bar {
            flex: 1;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .strength-fill {
            height: 100%;
            border-radius: 3px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .strength-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.3), 
                transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            to { left: 100%; }
        }

        .strength-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            min-width: 80px;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            color: white;
        }

        .strength-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
        }

        .controls {
            background: var(--bg-tertiary);
            border-radius: 16px;
            padding: 28px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            margin-bottom: 28px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            font-family: 'DM Mono', monospace;
            font-size: 16px;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: white;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(61, 213, 213, 0.1);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent-primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow-glow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--accent-primary);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px var(--shadow-glow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slider:hover::-webkit-slider-thumb {
            transform: scale(1.2);
            box-shadow: 0 4px 16px var(--shadow-glow);
        }

        .slider:hover::-moz-range-thumb {
            transform: scale(1.2);
            box-shadow: 0 4px 16px var(--shadow-glow);
        }

        .slider-value {
            font-family: 'DM Mono', monospace;
            font-size: 18px;
            font-weight: 500;
            color: var(--accent-primary);
            min-width: 32px;
            text-align: right;
        }

        .checkboxes {
            display: flex;
            gap: 20px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 0;
            transition: all 0.2s;
        }

        .checkbox-item:hover .checkbox-label {
            color: var(--text-primary);
        }

        .checkbox-custom {
            position: relative;
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .checkbox-custom input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            margin: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 22px;
            width: 22px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .checkbox-custom input:checked ~ .checkmark {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .checkmark::after {
            content: '';
            position: absolute;
            display: none;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-custom input:checked ~ .checkmark::after {
            display: block;
        }

        .checkbox-custom:hover .checkmark {
            border-color: var(--accent-primary);
        }

        .checkbox-label {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
            transition: color 0.2s;
        }

        .url-display {
            background: var(--bg-tertiary);
            border-radius: 16px;
            padding: 28px;
            border: 1px solid var(--border-color);
            margin-top: 28px;
        }

        .url-field {
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            color: var(--accent-primary);
            word-break: break-all;
            line-height: 1.6;
            background: #f9fafb;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .button {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .button-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 12px rgba(61, 213, 213, 0.3);
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(61, 213, 213, 0.4);
        }

        .button-primary:active {
            transform: translateY(0);
        }

        .result-display {
            background: var(--bg-tertiary);
            border-radius: 16px;
            padding: 28px;
            border: 1px solid var(--border-color);
            margin-top: 28px;
        }

        .result-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .result-value {
            font-family: 'DM Mono', monospace;
            font-size: 24px;
            font-weight: 500;
            color: var(--text-primary);
            word-break: break-all;
            line-height: 1.6;
            background: #f9fafb;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(61, 213, 213, 0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 640px) {
            body {
                padding: 20px;
            }

            .card {
                padding: 28px 20px;
            }

            .password-value {
                font-size: 20px;
                padding: 14px 16px;
            }

            .controls {
                padding: 20px;
            }

            .checkboxes {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="mode-badge" id="modeBadge">Encrypt Mode</div>
                <h1 class="title">Password Pusher</h1>
                <p class="subtitle">Securely share passwords</p>
            </div>

            <!-- Encrypt View -->
            <div id="encryptView" style="display: none;">
                <div class="password-display">
                    <div class="password-value" id="tokenValue">Click generate to create token</div>
                    <button class="icon-btn" id="refreshBtn" title="Generate new token">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>
                </div>

                <div class="strength-indicator">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-label">
                        <span class="strength-icon" id="strengthIcon"></span>
                        <span id="strengthText">Strong</span>
                    </div>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label class="control-label">Token Length</label>
                        <div class="slider-container">
                            <input type="range" min="12" max="50" value="50" class="slider" id="lengthSlider">
                            <span class="slider-value" id="lengthValue">50</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Characters Used</label>
                        <div class="checkboxes">
                            <label class="checkbox-item">
                                <div class="checkbox-custom">
                                    <input type="checkbox" id="uppercaseCheck" checked>
                                    <span class="checkmark"></span>
                                </div>
                                <span class="checkbox-label">Uppercase</span>
                            </label>
                            <label class="checkbox-item">
                                <div class="checkbox-custom">
                                    <input type="checkbox" id="lowercaseCheck" checked>
                                    <span class="checkmark"></span>
                                </div>
                                <span class="checkbox-label">Lowercase</span>
                            </label>
                            <label class="checkbox-item">
                                <div class="checkbox-custom">
                                    <input type="checkbox" id="numbersCheck" checked>
                                    <span class="checkmark"></span>
                                </div>
                                <span class="checkbox-label">Numbers</span>
                            </label>
                            <label class="checkbox-item">
                                <div class="checkbox-custom">
                                    <input type="checkbox" id="symbolsCheck" checked>
                                    <span class="checkmark"></span>
                                </div>
                                <span class="checkbox-label">Symbols</span>
                            </label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Passcode</label>
                        <input type="passcode" class="input-field" id="passcodeInput" placeholder="Secret Passcode" />
                    </div>
                </div>

                <div class="url-display" id="urlDisplay" style="display: none;">
                    <label class="control-label">Generated Password</label>
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                        <div class="password-value" style="margin-bottom: 0; flex: 1;" id="hashedPassword"></div>
                        <button class="icon-btn copy-btn" id="copyPasswordBtn" title="Copy password">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                            </svg>
                        </button>
                    </div>
                    
                    <label class="control-label">Share This URL</label>
                    <div class="url-field" id="urlField"></div>
                    <button class="button button-primary" id="copyUrlBtn">Copy URL to Clipboard</button>
                </div>
            </div>

            <!-- Decrypt View -->
            <div id="decryptView" style="display: none;">
                <div class="password-display">
                    <div class="password-value" id="tokenFromUrl">Loading token...</div>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label class="control-label">Passcode</label>
                        <input type="passcode" class="input-field" id="decryptPasscodeInput" placeholder="Secret Passcode" />
                    </div>
                </div>

                <div class="result-display" id="resultDisplay" style="display: none;">
                    <div class="result-label">Decrypted Password</div>
                    <div class="result-value" id="decryptedPassword"></div>
                    <button class="button button-primary" id="copyDecryptedBtn">Copy Password</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied!</div>

    <script>
        // Character sets
        const charSets = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '-._~'
        };

        // DOM elements
        const encryptView = document.getElementById('encryptView');
        const decryptView = document.getElementById('decryptView');
        const modeBadge = document.getElementById('modeBadge');
        const tokenValue = document.getElementById('tokenValue');
        const hashedPassword = document.getElementById('hashedPassword');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const uppercaseCheck = document.getElementById('uppercaseCheck');
        const lowercaseCheck = document.getElementById('lowercaseCheck');
        const numbersCheck = document.getElementById('numbersCheck');
        const symbolsCheck = document.getElementById('symbolsCheck');
        const refreshBtn = document.getElementById('refreshBtn');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const strengthIcon = document.getElementById('strengthIcon');
        const passcodeInput = document.getElementById('passcodeInput');
        const urlDisplay = document.getElementById('urlDisplay');
        const urlField = document.getElementById('urlField');
        const copyUrlBtn = document.getElementById('copyUrlBtn');
        const copyPasswordBtn = document.getElementById('copyPasswordBtn');
        const tokenFromUrl = document.getElementById('tokenFromUrl');
        const decryptPasscodeInput = document.getElementById('decryptPasscodeInput');
        const resultDisplay = document.getElementById('resultDisplay');
        const decryptedPassword = document.getElementById('decryptedPassword');
        const copyDecryptedBtn = document.getElementById('copyDecryptedBtn');
        const toast = document.getElementById('toast');

        let currentToken = '';

        // Convert MD5 hash to 50-character password
        function hashToPassword(hash) {
            // Use the hash to generate a deterministic 50-character password
            // MD5 hash is 32 hex characters, we'll extend it for more entropy
            
            const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lowercase = 'abcdefghijklmnopqrstuvwxyz';
            const numbers = '0123456789';
            const symbols = '-._~';
            
            // Create extended hash by hashing multiple times for more material
            const hash2 = md5(hash);
            const hash3 = md5(hash2);
            const combinedHash = hash + hash2 + hash3; // 96 hex characters
            
            let password = '';
            
            // Ensure we have at least one of each type in first 4 characters
            password += uppercase[parseInt(combinedHash.substring(0, 2), 16) % uppercase.length];
            password += lowercase[parseInt(combinedHash.substring(2, 4), 16) % lowercase.length];
            password += numbers[parseInt(combinedHash.substring(4, 6), 16) % numbers.length];
            password += symbols[parseInt(combinedHash.substring(6, 8), 16) % symbols.length];
            
            // Fill remaining 46 characters using all character sets
            const allChars = uppercase + lowercase + numbers + symbols;
            for (let i = 0; i < 46; i++) {
                const hashSegment = combinedHash.substring(8 + i * 2, 10 + i * 2);
                const charIndex = parseInt(hashSegment, 16) % allChars.length;
                password += allChars[charIndex];
            }
            
            // Shuffle the password deterministically using the hash
            const shuffled = password.split('');
            for (let i = shuffled.length - 1; i > 0; i--) {
                const hashPart = combinedHash.substring((i * 2) % 92, (i * 2) % 92 + 2);
                const j = parseInt(hashPart, 16) % (i + 1);
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            
            // Ensure exactly 50 characters (safeguard)
            const finalPassword = shuffled.join('').substring(0, 50);
            return finalPassword;
        }

        // Check URL parameters to determine mode
        const urlParams = new URLSearchParams(window.location.search);
        const tokenParam = urlParams.get('token');

        if (tokenParam) {
            // Decrypt mode
            modeBadge.textContent = 'Decrypt Mode';
            modeBadge.classList.remove('encrypt');
            modeBadge.classList.add('decrypt');
            decryptView.style.display = 'block';
            encryptView.style.display = 'none';
            
            // Display the token from URL
            tokenFromUrl.textContent = tokenParam;
            
            // Auto-generate password when passcode is entered
            decryptPasscodeInput.addEventListener('input', generateDecryptedPassword);
        } else {
            // Encrypt mode
            modeBadge.textContent = 'Encrypt Mode';
            modeBadge.classList.remove('decrypt');
            modeBadge.classList.add('encrypt');
            encryptView.style.display = 'block';
            decryptView.style.display = 'none';
            generateToken();
        }

        // Update length display
        lengthSlider.addEventListener('input', (e) => {
            lengthValue.textContent = e.target.value;
            generateToken();
        });

        // Generate token on checkbox change
        [uppercaseCheck, lowercaseCheck, numbersCheck, symbolsCheck].forEach(checkbox => {
            checkbox.addEventListener('change', generateToken);
        });

        // Passcode input change
        passcodeInput.addEventListener('input', updateUrl);

        // Generate token
        function generateToken() {
            const length = parseInt(lengthSlider.value);
            let chars = '';
            let token = '';

            if (uppercaseCheck.checked) chars += charSets.uppercase;
            if (lowercaseCheck.checked) chars += charSets.lowercase;
            if (numbersCheck.checked) chars += charSets.numbers;
            if (symbolsCheck.checked) chars += charSets.symbols;

            if (chars.length === 0) {
                tokenValue.textContent = 'Select at least one option';
                updateStrength(0);
                return;
            }

            // Ensure at least one character from each selected set
            if (uppercaseCheck.checked) token += charSets.uppercase[Math.floor(Math.random() * charSets.uppercase.length)];
            if (lowercaseCheck.checked) token += charSets.lowercase[Math.floor(Math.random() * charSets.lowercase.length)];
            if (numbersCheck.checked) token += charSets.numbers[Math.floor(Math.random() * charSets.numbers.length)];
            if (symbolsCheck.checked) token += charSets.symbols[Math.floor(Math.random() * charSets.symbols.length)];

            // Fill remaining length
            for (let i = token.length; i < length; i++) {
                token += chars[Math.floor(Math.random() * chars.length)];
            }

            // Shuffle token
            token = token.split('').sort(() => Math.random() - 0.5).join('');

            currentToken = token;
            tokenValue.textContent = token;
            calculateStrength(token);
            updateUrl();
        }

        // Calculate password strength
        function calculateStrength(password) {
            let strength = 0;
            
            if (password.length >= 8) strength += 20;
            if (password.length >= 12) strength += 20;
            if (password.length >= 16) strength += 10;
            if (/[a-z]/.test(password)) strength += 15;
            if (/[A-Z]/.test(password)) strength += 15;
            if (/[0-9]/.test(password)) strength += 15;
            if (/[^a-zA-Z0-9]/.test(password)) strength += 15;

            updateStrength(strength);
        }

        // Update strength indicator
        function updateStrength(strength) {
            const percentage = Math.min(strength, 100);
            strengthFill.style.width = percentage + '%';

            if (percentage < 40) {
                strengthFill.style.background = 'linear-gradient(90deg, var(--danger), #ff6666)';
                strengthText.textContent = 'Weak';
                strengthIcon.style.background = 'var(--danger)';
            } else if (percentage < 70) {
                strengthFill.style.background = 'linear-gradient(90deg, var(--warning), #ffcc00)';
                strengthText.textContent = 'Medium';
                strengthIcon.style.background = 'var(--warning)';
            } else {
                strengthFill.style.background = 'linear-gradient(90deg, var(--success), var(--accent-secondary))';
                strengthText.textContent = 'Strong';
                strengthIcon.style.background = 'var(--success)';
            }
        }

        // Update URL and generate password hash
        function updateUrl() {
            const passcode = passcodeInput.value.trim();
            
            if (!passcode || !currentToken) {
                urlDisplay.style.display = 'none';
                return;
            }

            // Generate password: MD5(salt + token)
            const hash = md5(passcode + currentToken);
            const password = hashToPassword(hash);
            hashedPassword.textContent = password;
            
            // Create URL with token in query string
            const baseUrl = window.location.href.split('?')[0];
            const shareUrl = `${baseUrl}?token=${encodeURIComponent(currentToken)}`;
            
            urlField.textContent = shareUrl;
            urlDisplay.style.display = 'block';
        }

        // Refresh button
        refreshBtn.addEventListener('click', () => {
            refreshBtn.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                refreshBtn.style.transform = '';
            }, 300);
            generateToken();
        });

        // Copy URL button
        copyUrlBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(urlField.textContent);
                showToast('URL copied!');
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        });

        // Copy password button
        copyPasswordBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(hashedPassword.textContent);
                showToast('Password copied!');
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        });

        // Auto-generate decrypted password when passcode changes
        function generateDecryptedPassword() {
            const passcode = decryptPasscodeInput.value.trim().toLowerCase();
            
            if (!passcode) {
                resultDisplay.style.display = 'none';
                return;
            }

            if (!tokenParam) {
                resultDisplay.style.display = 'none';
                return;
            }

            // Generate password: MD5(lowercase_salt + token)
            const hash = md5(passcode + tokenParam);
            const decryptedPwd = hashToPassword(hash);
            
            resultDisplay.style.display = 'block';
            decryptedPassword.textContent = decryptedPwd;
        }

        // Copy decrypted password button
        copyDecryptedBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(decryptedPassword.textContent);
                showToast('Password copied!');
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        });

        // Show toast notification
        function showToast(message = 'Copied!') {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
